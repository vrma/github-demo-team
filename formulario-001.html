<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script type="module" src="JS/formulario.js"></script>
</head>

<body>
  <h1>Formulario de Alta/Modificacion de Estudiantes</h1>

  <div class="container-fluid">
    <div class="row">
      <div class="col-2">
        <label for="filtroFacultades">Filtrar por Facultad</label>
        <select class="form-select" name="filtroFacultades" id="filtroFacultades">
          <option></option>
          <option value="Informatica">Informática</option>
          <option value="Ciencias">Ciencias</option>
          <option value="Electronica">Electrónica</option>
        </select>
      </div>
      <div class="col-10">
        <form action="#" method="post" id="formulario1">
          <label for="nombre">Nombre: </label>
          <input type="text" name="nombre" id="nombre" placeholder="Su nombre aqui, porfa!!" autofocus required>
          <label for="primerApellido">Primer Apellido: </label>
          <input type="text" name="primerApellido" id="primerApellido" required>
          <label for="segundoApellido">Segundo Apellido: </label>
          <input type="text" name="segundoApellido" id="segundoApellido">
          <fieldset>
            <legend>Genero</legend>
            <label for="hombre">Hombre</label>
            <input type="radio" id="hombre" value="Hombre" name="genero" required>

            <label for="mujer">Mujer</label>
            <input type="radio" id="mujer" value="Mujer" name="genero" required>

            <label for="otro">Otro</label>
            <input type="radio" id="otro" value="Otro" name="genero" required>
          </fieldset>
          <label for="fechaAlta">Fecha de Alta</label>
          <input type="date" id="fechaAlta" name="fechaAlta" required>

          <label for="facultad">Facultad</label>
          <select name="facultad" id="facultad" required>
            <option></option>
            <option value="Informatica">Informática</option>
            <option value="Ciencias">Ciencias</option>
            <option value="Electronica">Electrónica</option>
          </select>
          <input type="submit" value="Alta de Estudiante">
        </form>
      </div>

    </div>
    <div class="row">
      <div class="col">
        <table class="table table-hover table-stripe">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Primer Apellido</th>
              <th>Segundo Apellido</th>
              <th>Genero</th>
              <th>Fecha de Alta</th>
              <th>Facultad</th>
            </tr>
          </thead>
          <tbody id="tableBody">

          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>

</html>
